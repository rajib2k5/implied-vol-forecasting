# The model registry (model_def, data-model.md section 1) and the milestone 2 baseline settings.
#
# Not part of protocol_hash: the protocol (configs/protocol.yaml) is frozen, and these are
# model choices, not evaluation rules. Every value below was set before any forecast was
# scored, from the literature or a round number, never by looking at results (rule L6).
# Changing one after the dev losses have been seen is a hyper-parameter change: say so in the
# milestone walkthrough, and after the holdout has been seen, increment holdout_looks.
#
# model_def columns: model_id, label, family, fit_space, multistep, targets, milestone, retired.
# A model is never deleted, only retired (it still counts as a trial).
models:
  - model_id: rw
    label: Random walk
    family: naive
    fit_space: level
    multistep: none
    # rv21 added in M3: yhat = rv21 of the window ending at the origin (ADR 0001 D2's benchmark).
    targets: [vix_level, rv21]
    milestone: 2
    retired: false
  - model_id: hist_mean
    label: Historical mean (expanding)
    family: naive
    fit_space: level
    multistep: none
    targets: [vix_level]
    milestone: 2
    retired: false
  - model_id: hist_mean_252
    label: Historical mean (last 252 sessions)
    family: naive
    fit_space: level
    multistep: none
    targets: [vix_level]
    milestone: 2
    retired: false
  - model_id: arima_log
    label: ARIMA on log IV
    family: arima
    fit_space: log_level
    multistep: iterated
    targets: [vix_level]
    milestone: 2
    retired: false
  - model_id: har_log
    label: HAR on log IV (Corsi)
    family: har
    fit_space: log_level
    multistep: direct
    targets: [vix_level]
    milestone: 2
    retired: false
  # Milestone 3 (docs/milestones/03-garch-done-right.md). The rv21 track: h = 21 only.
  - model_id: har_rv
    label: HAR on realised variance
    family: har
    fit_space: variance
    multistep: direct
    targets: [rv21]
    milestone: 3
    retired: false
  - model_id: vix_implied
    label: VIX as a forecast of realised variance
    family: implied
    fit_space: level
    multistep: none
    targets: [rv21]
    milestone: 3
    retired: false
  - model_id: garch
    label: GARCH(1,1) on S&P 500 returns
    family: garch
    fit_space: returns
    multistep: iterated
    targets: [rv21]
    milestone: 3
    retired: false
  - model_id: gjr
    label: GJR-GARCH(1,1,1) on S&P 500 returns
    family: garch
    fit_space: returns
    multistep: iterated
    targets: [rv21]
    milestone: 3
    retired: false
  - model_id: egarch
    label: EGARCH(1,1,1) on S&P 500 returns
    family: garch
    fit_space: returns
    multistep: iterated
    targets: [rv21]
    milestone: 3
    retired: false
  # The vix_level track: an AR(p) with a constant on ln VIX and GARCH(1,1) errors on its innovations
  # (d = 0; amended M3, review A: was d = 1, the AR on the changes). GARCH is never fitted on the level.
  - model_id: arima_garch_log
    label: ARIMA-GARCH on log IV (AR mean, GARCH errors)
    family: garch
    fit_space: log_level
    multistep: iterated
    targets: [vix_level]
    milestone: 3
    retired: false
  # Milestone 4 (docs/milestones/04-lstm.md): one model id on both tracks, like rw. An LSTM over the 22
  # sessions t-21..t with HAR's regressors beside its last state; predicts the log change, scored as the
  # lognormal mean. The mean over lstm.members seeds; each member is kept in forecast_member.
  - model_id: lstm_log
    label: LSTM on log volatility (seed ensemble)
    family: ml
    fit_space: log_level
    multistep: direct
    targets: [vix_level, rv21]
    milestone: 4
    retired: false

baselines:
  # VIX is the protocol target (vix_level). The other implied-vol indices of
  # configs/iv_indices.yaml are secondary targets "<symbol>_level": forecast and scored with
  # the same calendar, folds and rules, but not protocol targets (adding one would change the
  # frozen protocol_hash). Owner decision O-M2-1 in docs/milestones/02-baselines.md.
  symbols: [VIX, VIX9D, VIX3M, VIX6M, VIX1Y, VVIX]
  # A fold is fitted for a symbol only when at least this many closes are dated <= its cutoff
  # (two years of sessions). Earlier folds give no forecast for that symbol, for every model.
  min_train_sessions: 504
  # hist_mean_252: the mean of the last 252 sessions of the calendar up to the cutoff.
  hist_window: 252
  arima:
    # (p, q) by AIC over 0..max_p x 0..max_q at every cutoff.
    # d_rule "d0" (default): d = 0, an ARMA with a constant on ln IV, which reverts to its mean;
    # the unit-root case is the random walk baseline's. "kpss" (an option): d = 1 if KPSS rejects
    # level stationarity at kpss_alpha, else 0, and no constant when d = 1. Amended M2, review A:
    # "kpss" was the default; on stationary AR(1) series as persistent as ln VIX it chose d = 1 on
    # 17-52% of seeds at fold sample sizes, and d = 1 at every real VIX cutoff (walkthrough,
    # "What review A found"). kpss_alpha is read only when d_rule is "kpss".
    max_p: 2
    max_q: 2
    d_rule: d0
    kpss_alpha: 0.05

# Milestone 3: the GARCH family. Set before any M3 forecast was scored (rule L6).
garch:
  # Innovations: at every cutoff each model is fitted with every distribution listed, and the fit with
  # the lower AIC is kept (a tie keeps the first). Pre-registered; decision D3 of the M3 walkthrough.
  dists: [normal, t]
  # arima_garch_log: AR order p in 0..max_p, chosen with the distribution by AIC on a common sample
  # (the first max_p values held back).
  max_p: 2
  # arima_garch_log's d. 0 (default): an AR(p) with a constant on 100 x ln VIX, which reverts to its
  # mean. 1 (an option): the AR on 100 x the daily change of ln VIX, no constant. Amended M3, review A:
  # d was 1; on the synthetic market (ln VIX an AR(1), phi 0.98) it was 2.8% worse than the random
  # walk at h = 21 and d = 0 was 9% better, M2's arima_log lesson again.
  d: 0

# Milestone 4: the LSTM (src/ivf/models/lstm.py). Set before any LSTM forecast was scored (rule L6), from
# ADR 0002's benchmark shape (hidden 32-64, batch 64, Adam 1e-3) and round numbers, never from results.
lstm:
  # Networks per training cutoff, identical but for the seed; the forecast is the mean of their log
  # forecasts. Member m's seed: SeedSequence(protocol.seed, spawn_key=(key32("lstm_log"), cutoff yyyymmdd, m))
  # (ADR 0001 D5). The data model's `lstm_members`; kept here, since a new protocol key changes protocol_hash.
  members: 5
  # Sessions t-21..t: exactly the window the runner's forecastable rule guarantees (at most 22).
  window: 22
  hidden: 32
  batch: 64
  lr: 0.001
  # Early stopping on the validation slice: stop after `patience` epochs without a new lowest loss,
  # keep the best epoch's weights.
  max_epochs: 50
  patience: 5
  # The validation slice: the last 252 usable origins before the cutoff, `H` sessions after the training slice.
  val_sessions: 252
  # O-M4-1 (refit frequency): a full retrain when at least this many sessions have passed since the last
  # one (252 = every 4th 63-session cutoff); the network is applied frozen in between. Default taken
  # 2026-10-29 from the measured training time (docs/milestones/04-lstm.md, section 7); owner can override.
  refit_every: 252
