# How one datum moves through implied-vol-forecasting: a CBOE CSV row ends up as a number in a JSON column array.
# Source of truth: docs/adr/0001-python-core-versioned-json-app.md (D3 storage, D4 protocol, L1-L7 no-look-ahead rules) and docs/architecture/data-model.md.
# Rendered by the vendored diagram toolkit (tools/diagrams/) into docs/architecture/out/; docs/architecture/data-flow.mmd is the M0 hand-kept copy.
#
# Nodes are the states a datum passes through; edges are the transformation between two states, with the L1-L7 rule that applies written on the edge.
#   L1 trailing windows only        L2 label availability (target_date <= cutoff)   L3 scalers fitted on training rows only
#   L4 LSTM early-stop block + purge   L5 regimes from data <= date, fixed thresholds   L6 hyper-parameters from dev rows only
#   L7 signal at origin t is executed at the close of t+1
# type:  source | store | process | model | output (a row, cell or array; called artifact before the kit's schema) | ui | external
#        A decision (a gate whose exits are all labelled) is type process here: the kit has no diamond. Its label ends in "?" and its exits are labelled yes or no.
# Each node's sublabel was called note before the kit's schema.
# This file was data-flow.yaml: the kit names its outputs after the file stem, which must be an identifier, so the hyphen became an underscore.
#
# Amended M1, checked against src/ivf/data/*.py, src/ivf/features/build.py, configs/ and tools/export_app_data.py:
#   - synth_csv: `--synthetic` runs write the seeded files under ROOT/synthetic/raw/ through the same store and log as a download.
#   - protocol_cfg: `check --freeze-data-end` writes data_end into configs/protocol.yaml, once, and never moves it. The calendar takes its end from there.
#     Amended M1, review B: it also writes configs/protocol.freeze.json (the value and its protocol_hash); check, eda and the notebook fail if the protocol no longer matches it.
#   - The calendar is built from XNYS dates alone (ivf.data.calendar), never from which closes exist. The two edges that said "keep dates where VIX closed" were M0 text;
#     they are now dashed "checked against" edges, because data_check compares the closes with the calendar and a gap stays null (gap policy G1).
#   - The real export reads interim and the frozen config, not the processed tables: iv_row and protocol_cfg feed json_col directly (the M1 ribbon).
#   - feature_row gains the three tenor ratios.
kind: flow
title: implied-vol-forecasting data flow (one datum, CSV row to JSON column)
direction: TB
legend:
  dashed: "Checked against the calendar, not used to build it"

lanes:
  - {id: ingest, label: "1. Ingest: raw to tidy"}
  - {id: features, label: "2. Features and targets (data ≤ t)"}
  - {id: walkforward, label: "3. Walk-forward fold (params frozen)"}
  - {id: scoring, label: "4. Scoring and backtest"}
  - {id: delivery, label: "5. Export and render"}

nodes:
  # ---------------- 1. Ingest ----------------
  - {id: csv_row, label: "CBOE CSV row", lane: ingest, type: source, sublabel: "one session of one index, e.g. VIX; some files are close-only"}
  - {id: spx_row, label: "price_daily row (^GSPC)", lane: ingest, type: source, sublabel: "yfinance; a price index, not dividend-adjusted"}
  - {id: vxx_row, label: "price_daily row (VXX, SVXY)", lane: ingest, type: source, sublabel: "yfinance; split-adjusted close"}
  - {id: synth_csv, label: "synthetic CSV (seeded)", lane: ingest, type: source, sublabel: "ivf.data.synthetic: Cboe- and Yahoo-shaped files with known truth; no download"}
  - {id: raw_file, label: "raw/{sha256}.csv", lane: ingest, type: store, sublabel: "bytes as downloaded; one line appended to provenance.jsonl. Synthetic runs: ROOT/synthetic/raw/"}
  - {id: iv_row, label: "iv_index_daily row", lane: ingest, type: output, sublabel: "tidy panel row: symbol, date, close in vol points, raw_sha256"}

  # ---------------- 2. Features and targets ----------------
  - {id: protocol_cfg, label: "configs/protocol.yaml", lane: features, type: store, sublabel: "data_end is null until frozen, then fixed and part of protocol_hash; the freeze record beside it must match"}
  - {id: cal_row, label: "calendar row", lane: features, type: output, sublabel: "date, t_idx, period; every XNYS session to data_end plus h_max, from dates alone"}
  - {id: feature_row, label: "feature row at origin t", lane: features, type: output, sublabel: "log_vix, har_w, har_m, r_spx, rv21_back, vov21, iv_rv_spread, vix9d_vix, vix_vix3m, vix3m_vix6m, vix6m_vix1y"}
  - {id: target_row, label: "target_value row", lane: features, type: output, sublabel: "y(d) in vol points and v = (y/100)^2"}
  - {id: regime_row, label: "regime_label row", lane: features, type: output, sublabel: "low, mid, high; contango, backwardation"}

  # ---------------- 3. Walk-forward fold ----------------
  - {id: fold_row, label: "fold assignment", lane: walkforward, type: output, sublabel: "origin t in fold k; cutoff c_k = idx(holdout_start) + 63k"}
  - {id: pair_ok, label: "target_date ≤ cutoff?", lane: walkforward, type: process, sublabel: "L2: label availability"}  # was type: decision (a gate; the kit has no diamond, the labelled exits carry it)
  - {id: excluded, label: "pair left out of training", lane: walkforward, type: output, sublabel: "its target is dated after the cutoff"}
  - {id: scaler, label: "scaler, imputer, OLS moments", lane: walkforward, type: process, sublabel: "fitted at the cutoff on training rows only"}
  - {id: fitted, label: "fitted model, params frozen", lane: walkforward, type: model, sublabel: "frozen for origins in [c_k, c_{k+1}); state updates daily with data ≤ t"}
  - {id: forecast_row, label: "forecast row", lane: walkforward, type: output, sublabel: "model, target, origin, horizon, target_date, yhat, v_hat"}

  # ---------------- 4. Scoring and backtest ----------------
  - {id: loss_row, label: "loss row", lane: scoring, type: output, sublabel: "squared, absolute and pct error, QLIKE; transient, no stored table"}
  - {id: test_cell, label: "DM / MZ cell", lane: scoring, type: output, sublabel: "n, statistic, p-value for a model pair or a model"}
  - {id: metric_cell, label: "metric cell (model x horizon x regime)", lane: scoring, type: output, sublabel: "n, bias, rmse, mae, mape, qlike per target and period"}
  - {id: n_check, label: "n ≥ min_cell_n (20)?", lane: scoring, type: process, sublabel: "suppression rule, ADR D4 4.8"}  # was type: decision (a gate; the kit has no diamond, the labelled exits carry it)
  - {id: blank, label: "blank cell", lane: scoring, type: output, sublabel: "value null, n kept"}
  - {id: signal_row, label: "signal at origin t", lane: scoring, type: output, sublabel: "+1 long vol, -1 short vol, 0 flat"}
  - {id: bt_row, label: "backtest_daily row", lane: scoring, type: output, sublabel: "gross_ret, cost, net_ret, equity, drawdown"}

  # ---------------- 5. Export and render ----------------
  - {id: json_col, label: "JSON column array", lane: delivery, type: output, sublabel: "one array per column; NaN and suppressed cells become null"}
  - {id: app_draw, label: "app: typed array / three.js buffer", lane: delivery, type: ui, sublabel: "indexes, decimates and colours; computes nothing"}

edges:
  # ingest
  - {from: csv_row, to: raw_file, label: "download, SHA-256 (idempotent)"}
  - {from: synth_csv, to: raw_file, label: "--synthetic: same store, written under ROOT/synthetic/raw/"}
  - {from: raw_file, to: iv_row, label: "parse: close > 0 in vol points"}
  # data_end, calendar, features, targets, regimes
  - {from: iv_row, to: protocol_cfg, label: "check --freeze-data-end: last session with a settled VIX close"}
  - {from: spx_row, to: protocol_cfg, label: "and a settled ^GSPC close; written once, never moved"}
  - {from: protocol_cfg, to: cal_row, label: "XNYS sessions from train_start to data_end, plus h_max"}
  - {from: iv_row, to: cal_row, label: "data_check: a VIX close on every session; a gap stays null (G1)", style: dashed}
  - {from: spx_row, to: cal_row, label: "data_check: a ^GSPC close on every session", style: dashed}
  - {from: iv_row, to: feature_row, label: "log: ln V_t; HAR means over t-4..t, t-21..t; tenor ratios, shorter over longer (L1)"}
  - {from: spx_row, to: feature_row, label: "r_d = ln(P_d / P_d-1); RV over trailing 21 sessions (L1)"}
  - {from: iv_row, to: target_row, label: "vix_level: y = V_d"}
  - {from: spx_row, to: target_row, label: "rv21: 100·sqrt((252/21)·Σ r²) over 21 sessions"}
  - {from: iv_row, to: regime_row, label: "fixed cut-offs 15 and 25; VIX vs VIX3M (L5)"}
  # walk-forward
  - {from: cal_row, to: fold_row, label: "t+h is the h-th session after t"}
  - {from: feature_row, to: fold_row, label: "assign origin t to a 63-session fold"}
  - {from: fold_row, to: pair_ok, label: "candidate pair (x_τ, y_τ+h)"}
  - {from: pair_ok, to: scaler, label: "yes: keep"}
  - {from: pair_ok, to: excluded, label: "no: drop"}
  - {from: scaler, to: fitted, label: "train-only scaler (L3); LSTM early-stop block + purge (L4)"}
  - {from: fitted, to: forecast_row, label: "h-session ahead, h = 1, 5, 21: target_date = T[idx(origin)+h]"}
  - {from: feature_row, to: forecast_row, label: "x_t: inputs dated ≤ t (L1)"}
  # scoring
  - {from: forecast_row, to: loss_row, label: "e = y - yhat; QLIKE in variance space"}
  - {from: target_row, to: loss_row, label: "join on (target_id, target_date)"}
  - {from: loss_row, to: metric_cell, label: "mean by model, horizon, period, regime (L6: tune on dev rows)"}
  - {from: regime_row, to: metric_cell, label: "regime at the origin (L5)"}
  - {from: loss_row, to: test_cell, label: "DM: d = L_a - L_b, rectangular lag h-1 + HLN; MZ: y on yhat, NW lag h-1 (O5)"}
  - {from: metric_cell, to: n_check, label: "count the rows"}
  - {from: n_check, to: blank, label: "no: suppress"}
  # backtest
  - {from: forecast_row, to: signal_row, label: "sign(yhat - V_t) with a band"}
  - {from: signal_row, to: bt_row, label: "execute at close of t+1 (L7)"}
  - {from: vxx_row, to: bt_row, label: "adj_close return, usable segment; minus cost"}
  # export and render
  - {from: n_check, to: json_col, label: "yes: round (RMSE 4 dp, QLIKE 6 dp)"}
  - {from: blank, to: json_col, label: "null in the cube"}
  - {from: test_cell, to: json_col, label: "p-values, 4 dp"}
  - {from: bt_row, to: json_col, label: "equity, drawdown, 6 dp"}
  - {from: iv_row, to: json_col, label: "M1 real export: tenor levels 2 dp, VIX/VIX3M 4 dp, flag from the unrounded ratio"}
  - {from: protocol_cfg, to: json_col, label: "M1 real export: ribbon runs from the first session with all five tenors to data_end"}
  - {from: json_col, to: app_draw, label: "typed array; index, decimate"}
