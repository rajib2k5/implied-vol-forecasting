# ERD spec for implied-vol-forecasting, milestones 0-6. Source of truth: docs/architecture/data-model.md.
# Rendered by the shared diagram toolkit (tools/diagrams/) once it is vendored (M1). Until then erd.mmd is hand-synced
# with this file: edit both. (amended M0, review B)
#
# store:       yaml (committed config) | raw_csv | jsonl | parquet | json (app contract, store: json)
# cardinality: "<from>:<to>" multiplicities, UML-style: the left side says how many `from` rows relate to one `to` row,
#              the right side how many `to` rows relate to one `from` row. e.g. raw_file -> raw_fetch "1:1..*".
# Every processed parquet table also has run_id -> run.run_id; only the main run edges are drawn.
kind: erd
title: implied-vol-forecasting data model (M0-M6)

entities:
  # ---------------- config (committed YAML) ----------------
  - id: protocol
    label: protocol (configs/protocol*.yaml)
    store: yaml
    columns:
      - {name: protocol_hash, type: str, pk: true}
      - {name: train_start, type: date}
      - {name: dev_start, type: date}
      - {name: holdout_start, type: date}
      - {name: data_end, type: date}
      - {name: horizons, type: "i16[]"}
      - {name: fold_len, type: i16}
      - {name: min_cell_n, type: i16}
      - {name: vix_regime_edges, type: "f64[]"}
      - {name: seed, type: i64}
      - {name: lstm_members, type: i16}
      - {name: cost_bps, type: f64}
      - {name: race_context_sessions, type: i16}
      - {name: holdout_looks, type: i16}
  - id: target_def
    label: target_def (configs/protocol.yaml)
    store: yaml
    columns:
      - {name: target_id, type: str, pk: true}
      - {name: label, type: str}
      - {name: units, type: str}
      - {name: horizons, type: "i16[]"}
      - {name: definition, type: str}
  - id: model_def
    label: model_def (configs/models.yaml)
    store: yaml
    columns:
      - {name: model_id, type: str, pk: true}
      - {name: label, type: str}
      - {name: family, type: str}
      - {name: fit_space, type: str}
      - {name: multistep, type: str}
      - {name: targets, type: "str[]"}
      - {name: milestone, type: i16}
      - {name: retired, type: bool}
  - id: strategy_def
    label: strategy_def (configs/strategies.yaml)
    store: yaml
    columns:
      - {name: strategy_id, type: str, pk: true}
      - {name: label, type: str}
      - {name: kind, type: str}
      - {name: model_id, type: str, fk: model_def.model_id, nullable: true}
      - {name: target_id, type: str, fk: target_def.target_id, nullable: true}
      - {name: horizon, type: i16, nullable: true}
      - {name: rule, type: str}
      - {name: params_json, type: str}
      - {name: retired, type: bool}
  - id: iv_index_meta
    label: iv_index_meta (configs/iv_indices.yaml)
    store: yaml
    columns:
      - {name: symbol, type: str, pk: true}
      - {name: name, type: str}
      - {name: tenor_days, type: i16, nullable: true}
      - {name: underlying, type: str, fk: instrument_meta.ticker, nullable: true}
      - {name: group, type: str}
      - {name: cboe_url, type: str}
      - {name: fred_series, type: str, nullable: true}
  - id: instrument_meta
    label: instrument_meta (configs/instruments.yaml)
    store: yaml
    columns:
      - {name: ticker, type: str, pk: true}
      - {name: role, type: str}
      - {name: name, type: str}
  - id: tradable_segment
    label: tradable_segment (configs/instruments.yaml)
    store: yaml
    columns:
      - {name: ticker, type: str, pk: true, fk: instrument_meta.ticker}
      - {name: valid_from, type: date, pk: true}
      - {name: valid_to, type: date, nullable: true}
      - {name: leverage, type: f64}
      - {name: usable, type: bool}
      - {name: note, type: str}

  # ---------------- raw (never committed) ----------------
  - id: raw_file
    label: raw_file (ROOT/raw/{source}/{symbol}/{sha256}.csv)
    store: raw_csv
    columns:
      - {name: sha256, type: str, pk: true}
      - {name: source, type: str}
      - {name: symbol, type: str}
      - {name: raw_path, type: str}
      - {name: bytes, type: i64}
  - id: raw_fetch
    label: raw_fetch (ROOT/raw/provenance.jsonl)
    store: jsonl
    columns:
      - {name: fetch_id, type: str, pk: true}
      - {name: sha256, type: str, fk: raw_file.sha256}
      - {name: source, type: str}
      - {name: symbol, type: str}
      - {name: url, type: str}
      - {name: final_url, type: str}
      - {name: fetched_at, type: ts}
      - {name: http_status, type: i16, nullable: true}
      - {name: bytes, type: i64}
      - {name: raw_path, type: str}
      - {name: changed, type: bool}
      - {name: tool_version, type: str}

  # ---------------- interim (never committed) ----------------
  - id: iv_index_daily
    label: iv_index_daily (ROOT/interim)
    store: parquet
    columns:
      - {name: symbol, type: str, pk: true, fk: iv_index_meta.symbol}
      - {name: date, type: date, pk: true}
      - {name: open, type: f64, nullable: true}
      - {name: high, type: f64, nullable: true}
      - {name: low, type: f64, nullable: true}
      - {name: close, type: f64}
      - {name: source, type: str}
      - {name: raw_sha256, type: str, fk: raw_file.sha256}
  - id: price_daily
    label: price_daily (ROOT/interim)
    store: parquet
    columns:
      - {name: ticker, type: str, pk: true, fk: instrument_meta.ticker}
      - {name: date, type: date, pk: true}
      - {name: open, type: f64}
      - {name: high, type: f64}
      - {name: low, type: f64}
      - {name: close, type: f64}
      - {name: adj_close, type: f64}
      - {name: volume, type: i64, nullable: true}
      - {name: raw_sha256, type: str, fk: raw_file.sha256}

  # ---------------- processed (never committed; run_id-partitioned) ----------------
  - id: run
    label: run (ROOT/processed/runs.parquet; provenance stays local)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true}
      - {name: protocol_hash, type: str, fk: protocol.protocol_hash}
      - {name: data_mode, type: str}
      - {name: source_commit, type: str}
      - {name: source_dirty, type: bool}
      - {name: started_at, type: ts}
      - {name: finished_at, type: ts, nullable: true}
      - {name: ivf_version, type: str}
      - {name: python_version, type: str}
      - {name: platform, type: str}
  - id: run_input
    label: run_input
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: raw_sha256, type: str, pk: true, fk: raw_file.sha256}
      - {name: source, type: str}
      - {name: symbol, type: str}
  - id: calendar
    label: calendar (master sessions)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: date, type: date, pk: true}
      - {name: t_idx, type: i32}
      - {name: period, type: str}
      - {name: fold_id, type: i32, nullable: true}
  - id: feature
    label: feature
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: calendar.run_id}
      - {name: date, type: date, pk: true, fk: calendar.date}
      - {name: log_vix, type: f64}
      - {name: har_w, type: f64, nullable: true}   # amended M0, review D: undefined for the first 4 sessions
      - {name: har_m, type: f64, nullable: true}   # amended M0, review D: undefined for the first 21 sessions
      - {name: r_spx, type: f64, nullable: true}
      - {name: rv21_back, type: f64, nullable: true}
      - {name: vov21, type: f64, nullable: true}
      - {name: vix_vix3m, type: f64, nullable: true}
      - {name: iv_rv_spread, type: f64, nullable: true}
  - id: target_value
    label: target_value
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: calendar.run_id}
      - {name: target_id, type: str, pk: true, fk: target_def.target_id}
      - {name: date, type: date, pk: true, fk: calendar.date}
      - {name: y, type: f64}
      - {name: v, type: f64}
  - id: regime_label
    label: regime_label
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: calendar.run_id}
      - {name: date, type: date, pk: true, fk: calendar.date}
      - {name: scheme, type: str, pk: true}
      - {name: regime, type: str}
      - {name: driver, type: f64}
  - id: eda_stat
    label: eda_stat (-> reports/eda_stats.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: symbol, type: str, pk: true, fk: iv_index_meta.symbol}
      - {name: stat, type: str, pk: true}
      - {name: sample, type: str, pk: true}
      - {name: value, type: f64}
      - {name: n, type: i32}
  - id: data_check
    label: data_check (-> reports/data_checks.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: check_id, type: str, pk: true}
      - {name: symbol, type: str, pk: true}
      - {name: n_affected, type: i32}
      - {name: detail, type: str}
  - id: fold
    label: fold (63-session walk-forward block)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: fold_id, type: i32, pk: true}
      - {name: cutoff_date, type: date, fk: calendar.date}
      - {name: last_origin, type: date}
      - {name: period, type: str}
      - {name: n_sessions, type: i16}
  - id: fit
    label: fit
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: fold.run_id}
      - {name: model_id, type: str, pk: true, fk: model_def.model_id}
      - {name: fold_id, type: i32, pk: true, fk: fold.fold_id}
      - {name: member, type: i16, pk: true}
      - {name: cutoff_date, type: date}
      - {name: n_train, type: i32}
      - {name: train_first_date, type: date}
      - {name: train_last_target_date, type: date}
      - {name: converged, type: bool}
      - {name: fallback, type: str}
      - {name: params_json, type: str}
      - {name: hyperparams_json, type: str}
      - {name: seed, type: i64, nullable: true}
      - {name: device, type: str}
      - {name: fit_seconds, type: f64}
      - {name: loglik, type: f64, nullable: true}
      - {name: aic, type: f64, nullable: true}
      - {name: epochs_run, type: i16, nullable: true}
  - id: forecast
    label: forecast
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: fold.run_id}
      - {name: model_id, type: str, pk: true, fk: model_def.model_id}
      - {name: target_id, type: str, pk: true, fk: target_value.target_id}
      - {name: origin_date, type: date, pk: true, fk: calendar.date}
      - {name: horizon, type: i16, pk: true}
      - {name: target_date, type: date, fk: target_value.date}
      - {name: fold_id, type: i32, fk: fold.fold_id}
      - {name: yhat, type: f64}
      - {name: v_hat, type: f64}
      - {name: var_method, type: str}
      - {name: pi80_lo, type: f64, nullable: true}
      - {name: pi80_hi, type: f64, nullable: true}
      - {name: n_members, type: i16}
  - id: forecast_member
    label: forecast_member (LSTM seeds)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: forecast.run_id}
      - {name: model_id, type: str, pk: true, fk: forecast.model_id}
      - {name: target_id, type: str, pk: true, fk: forecast.target_id}
      - {name: origin_date, type: date, pk: true, fk: forecast.origin_date}
      - {name: horizon, type: i16, pk: true, fk: forecast.horizon}
      - {name: member, type: i16, pk: true, fk: fit.member}
      - {name: fold_id, type: i32, fk: fit.fold_id}   # amended M0, review B: needed for the FK to fit(model_id, fold_id, member)
      - {name: yhat, type: f64}
      - {name: v_hat, type: f64}
  - id: metric
    label: metric (-> reports/metrics.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: model_id, type: str, pk: true, fk: model_def.model_id}
      - {name: target_id, type: str, pk: true, fk: target_def.target_id}
      - {name: horizon, type: i16, pk: true}
      - {name: period, type: str, pk: true}
      - {name: scheme, type: str, pk: true}
      - {name: regime, type: str, pk: true}
      - {name: n, type: i32}
      - {name: suppressed, type: bool}
      - {name: bias, type: f64, nullable: true}
      - {name: rmse, type: f64, nullable: true}
      - {name: mae, type: f64, nullable: true}
      - {name: mape, type: f64, nullable: true}
      - {name: qlike, type: f64, nullable: true}
  - id: dm_test
    label: dm_test (-> reports/dm_tests.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: target_id, type: str, pk: true, fk: target_def.target_id}
      - {name: horizon, type: i16, pk: true}
      - {name: period, type: str, pk: true}
      - {name: scheme, type: str, pk: true}
      - {name: regime, type: str, pk: true}
      - {name: loss, type: str, pk: true}
      - {name: model_a, type: str, pk: true, fk: model_def.model_id}
      - {name: model_b, type: str, pk: true, fk: model_def.model_id}
      - {name: n, type: i32}
      - {name: mean_d, type: f64}
      - {name: dm_stat, type: f64}
      - {name: p_value, type: f64}
      - {name: nw_lags, type: i16}
  - id: mz_regression
    label: mz_regression (-> reports/mz_regressions.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: model_id, type: str, pk: true, fk: model_def.model_id}
      - {name: target_id, type: str, pk: true, fk: target_def.target_id}
      - {name: horizon, type: i16, pk: true}
      - {name: period, type: str, pk: true}
      - {name: space, type: str}
      - {name: n, type: i32}
      - {name: alpha, type: f64}
      - {name: alpha_se, type: f64}
      - {name: beta, type: f64}
      - {name: beta_se, type: f64}
      - {name: r2, type: f64}
      - {name: wald_stat, type: f64}
      - {name: wald_p, type: f64}
      - {name: nw_lags, type: i16}
  - id: backtest_daily
    label: backtest_daily
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: calendar.run_id}
      - {name: strategy_id, type: str, pk: true, fk: strategy_def.strategy_id}
      - {name: date, type: date, pk: true, fk: calendar.date}
      - {name: origin_date, type: date}
      - {name: signal, type: i8}
      - {name: w_vxx, type: f64}
      - {name: w_svxy, type: f64}
      - {name: gross_ret, type: f64}
      - {name: cost, type: f64}
      - {name: net_ret, type: f64}
      - {name: equity, type: f64}
      - {name: drawdown, type: f64}
      - {name: turnover, type: f64}
  - id: strategy_summary
    label: strategy_summary (-> reports/strategy_summary.csv)
    store: parquet
    columns:
      - {name: run_id, type: str, pk: true, fk: run.run_id}
      - {name: strategy_id, type: str, pk: true, fk: strategy_def.strategy_id}
      - {name: period, type: str, pk: true}
      - {name: n_days, type: i32}
      - {name: ann_return, type: f64}
      - {name: ann_vol, type: f64}
      - {name: sharpe_ann, type: f64}
      - {name: sr_daily, type: f64}
      - {name: skew, type: f64}
      - {name: kurt_pearson, type: f64}
      - {name: psr0, type: f64}
      - {name: n_trials, type: i32}
      - {name: e_max_sr, type: f64}
      - {name: dsr, type: f64}
      - {name: max_drawdown, type: f64}
      - {name: turnover_ann, type: f64}
      - {name: cost_bps, type: f64}

  # ---------------- app JSON contract (store: json) ----------------
  - id: json_manifest
    label: manifest.json
    store: json
    columns:
      - {name: schema_version, type: str}
      - {name: generated_at, type: str}
      - {name: source_commit, type: str}
      - {name: source_dirty, type: bool}
      - {name: data_mode, type: str}
      - {name: dataset, type: str}   # amended M0, review B: envelope field was missing
      - {name: run_id, type: str, fk: run.run_id}
      - {name: notice, type: str}
      - {name: protocol, type: object}
      - {name: files, type: "object[]"}
      - {name: models, type: "object[]"}
      - {name: targets, type: "object[]"}
  - id: json_term_structure
    label: term_structure.json (series)
    store: json
    columns:
      - {name: dates, type: "isoDate[]"}
      - {name: tenors, type: "object[]"}
      - {name: levels, type: "number[][]", nullable: true}
      - {name: vix_vix3m, type: "number[]", nullable: true}
      - {name: backwardation, type: "bool[]", nullable: true}
  - id: json_model_race
    label: model_race.json (series)
    store: json
    columns:
      - {name: calendar, type: "isoDate[]"}
      - {name: holdout_start_idx, type: int}
      - {name: panels, type: "object[]"}
      - {name: panels.target_id, type: str, fk: target_def.target_id}
      - {name: panels.horizon, type: int}
      - {name: panels.origin_idx0, type: int}
      - {name: panels.n, type: int}
      - {name: panels.actual, type: "number[]", nullable: true}
      - {name: panels.series, type: "object[]"}
      - {name: panels.mz, type: "object[]"}
  - id: json_error_surface
    label: error_surface.json (aggregate)
    store: json
    columns:
      - {name: periods, type: "str[]"}
      - {name: regimes, type: "object[]"}
      - {name: surfaces, type: "object[]"}
      - {name: surfaces.target_id, type: str, fk: target_def.target_id}
      - {name: surfaces.benchmark_model_id, type: str, fk: model_def.model_id}   # amended M0, review B: was missing
      - {name: surfaces.models, type: "str[]"}
      - {name: surfaces.horizons, type: "int[]"}
      - {name: surfaces.values, type: object}   # required object of metric cubes (cells inside may be null); amended M0, review D: not nullable, as in the schema
      - {name: surfaces.n, type: cube}
      - {name: surfaces.dm_p_vs_benchmark, type: object}   # required object of loss cubes (cells may be null); amended M0, review D
  - id: json_equity_curves
    label: equity_curves.json (series)
    store: json
    columns:
      - {name: dates, type: "isoDate[]"}
      - {name: holdout_start_idx, type: int, nullable: true}
      - {name: cost_bps, type: number}
      - {name: strategies, type: "object[]"}
      - {name: regime_segments, type: "object[]"}
      - {name: summary, type: "object[]"}
      - {name: caveats, type: "str[]"}

relations:
  # raw and interim
  - {from: raw_file, to: raw_fetch, cardinality: "1:1..*", label: fetched as}
  - {from: raw_file, to: iv_index_daily, cardinality: "1:0..*", label: parsed into}
  - {from: raw_file, to: price_daily, cardinality: "1:0..*", label: parsed into}
  - {from: iv_index_meta, to: iv_index_daily, cardinality: "1:0..*", label: has rows}
  - {from: instrument_meta, to: price_daily, cardinality: "1:0..*", label: has rows}
  - {from: instrument_meta, to: tradable_segment, cardinality: "1:0..*", label: usable segments}
  - {from: instrument_meta, to: iv_index_meta, cardinality: "0..1:0..*", label: underlying of}
  # provenance
  - {from: protocol, to: run, cardinality: "1:0..*", label: governs}
  - {from: run, to: run_input, cardinality: "1:1..*", label: reads}
  - {from: raw_file, to: run_input, cardinality: "1:0..*", label: used by}
  - {from: run, to: calendar, cardinality: "1:1..*", label: defines}
  - {from: run, to: fold, cardinality: "1:1..*", label: splits into}
  - {from: run, to: eda_stat, cardinality: "1:0..*", label: summarises}
  - {from: run, to: data_check, cardinality: "1:0..*", label: checks}
  # time-keyed processed tables
  - {from: calendar, to: feature, cardinality: "1:0..1", label: features at t}
  - {from: calendar, to: target_value, cardinality: "1:0..*", label: target at d}
  - {from: target_def, to: target_value, cardinality: "1:0..*", label: defines}
  - {from: calendar, to: regime_label, cardinality: "1:0..*", label: regime at t}
  - {from: calendar, to: fold, cardinality: "1:0..1", label: cutoff}
  # walk-forward
  - {from: fold, to: fit, cardinality: "1:1..*", label: refits}
  - {from: model_def, to: fit, cardinality: "1:0..*", label: fitted as}
  - {from: fold, to: forecast, cardinality: "1:1..*", label: issues}
  - {from: model_def, to: forecast, cardinality: "1:0..*", label: forecasts}
  - {from: calendar, to: forecast, cardinality: "1:0..*", label: origin}
  - {from: target_value, to: forecast, cardinality: "0..1:0..*", label: is target of once observed}   # amended M0, review B: unscored forecasts exist
  - {from: forecast, to: forecast_member, cardinality: "1:0..*", label: averages}
  - {from: fit, to: forecast_member, cardinality: "1:0..*", label: produces}
  # evaluation
  - {from: forecast, to: metric, cardinality: "0..*:1..*", label: aggregated into}
  - {from: model_def, to: metric, cardinality: "1:0..*", label: scored}
