# End-to-end system architecture for implied-vol-forecasting, milestones 0-6. Source of truth: docs/adr/0001-python-core-versioned-json-app.md.
# Rendered by the shared diagram toolkit (tools/diagrams/) once it is vendored; until then architecture.mmd is hand-kept in sync.
#
# type:  source (data we do not own) | external (code we do not own) | process (code that runs) | model (fitted forecaster)
#        store (persistent table or file) | artifact (a committed or exported product) | ui (what the learner sees)
# ROOT:  $VOL_DATA_DIR/implied-vol-forecasting, with VOL_DATA_DIR defaulting to ~/data/vol-projects. Synthetic runs use the same layout under ROOT/synthetic/.
# Drawn at module level. The stage that builds calendar, target_value and regime_label has no module name in ADR-0001 (D3 says "the pipeline stages"), so it is drawn inside ivf.features.
kind: flow
title: implied-vol-forecasting system architecture (M0-M6)
direction: TB

lanes:
  - {id: external, label: External}
  - {id: core, label: "Python core (src/ivf)"}
  - {id: storage, label: Storage}
  - {id: tooling, label: Tooling}
  - {id: app, label: App}

nodes:
  # ---------------- External ----------------
  - {id: cboe, label: "CBOE index CSVs", lane: external, type: source, note: "cdn.cboe.com .../daily_prices/{SYM}_History.csv, 307 to cdn-api.cboe.com"}
  - {id: fred, label: "FRED *CLS series", lane: external, type: source, note: "fallback: only fills dates missing from Cboe"}
  - {id: yfinance, label: yfinance, lane: external, type: source, note: "^GSPC and other underlyings, VXX, SVXY; auto_adjust=False"}
  - {id: sharpe, label: "sharpe-observatory scripts/metrics.py", lane: external, type: external, note: "PSR, expected max SR, DSR (MIT, reused)"}

  # ---------------- Python core ----------------
  - {id: fetch, label: ivf.data.fetch, lane: core, type: process, note: "temp file, SHA-256, rename to {sha256}.csv if absent; skip within --max-age 1 day"}
  - {id: synthetic, label: ivf.data.synthetic, lane: core, type: process, note: "seeded two-factor generator; hand-set parameters, not fitted"}
  - {id: build_interim, label: ivf.data.build_interim, lane: core, type: process, note: "typed, deduplicated, one table per source kind; latest snapshot unless --snapshot"}
  - {id: verify, label: ivf data verify, lane: core, type: process, note: "re-hash every raw file; fail on any mismatch"}
  - {id: features, label: ivf.features, lane: core, type: process, note: "trailing windows only (L1); also calendar, targets, regimes (L5)"}
  - {id: splits, label: ivf.evaluation.splits, lane: core, type: process, note: "expanding window, 63-session folds, shared by every model"}
  - {id: models, label: ivf.models, lane: core, type: model, note: "rw, hist_mean, ARIMA, HAR, GARCH/GJR/EGARCH, ARIMA-GARCH, LSTM; params frozen within a fold"}
  - {id: evaluation, label: ivf.evaluation, lane: core, type: process, note: "RMSE, MAE, MAPE, QLIKE, bias; Diebold-Mariano; Mincer-Zarnowitz; regimes"}
  - {id: backtest, label: ivf.backtest, lane: core, type: process, note: "VXX/SVXY signals executed at close of t+1 (L7), costs, PSR/DSR"}
  - {id: ivf_reports, label: ivf.reports, lane: core, type: process, note: "commits only publication set P (unitless ratios, 2 dp tests); one release per frozen data_end; needs a clean tree"}

  # ---------------- Storage ----------------
  - {id: configs, label: "configs/*.yaml", lane: storage, type: store, note: "protocol, models, strategies, iv_indices, instruments; committed. Every stage reads protocol.yaml; ivf.models reads models.yaml; ivf.backtest reads strategies.yaml"}
  - {id: raw, label: "ROOT/raw/{source}/{symbol}/{sha256}.csv", lane: storage, type: store, note: "bytes as downloaded; never committed"}
  - {id: prov, label: "ROOT/raw/provenance.jsonl", lane: storage, type: store, note: "append-only, one line per fetch, written even if unchanged"}
  - {id: synth_raw, label: "ROOT/synthetic/raw/", lane: storage, type: store, note: "Cboe-shaped CSVs and Yahoo-shaped tables; never committed"}
  - {id: interim, label: "ROOT/interim/{table}.parquet", lane: storage, type: store, note: "iv_index_daily, price_daily; every row keeps raw_sha256"}
  - {id: processed, label: "ROOT/processed/run_id=<id>/{table}.parquet", lane: storage, type: store, note: "calendar, feature, target_value, regime_label, fold, eda_stat, data_check; runs.parquet beside it"}
  - {id: forecasts, label: "forecast and fit tables", lane: storage, type: store, note: "under processed/run_id=<id>/; key (run_id, model_id, target_id, origin_date, horizon)"}
  - {id: results, label: "metric, dm_test, mz_regression, backtest_daily, strategy_summary", lane: storage, type: store, note: "under processed/run_id=<id>/"}
  - {id: reports_dir, label: "reports/*.agg.csv", lane: storage, type: artifact, note: "committed: publication set P only (unitless, rounded), source_dirty = false"}
  - {id: schemas, label: "schemas/app-data/", lane: storage, type: store, note: "JSON Schemas: the single source of truth for the contract"}
  - {id: synth_json, label: "app/public/data/synthetic/*.json", lane: storage, type: artifact, note: "committed fixture; data_mode synthetic"}
  - {id: real_json, label: "ROOT/app-data/real/*.json", lane: storage, type: artifact, note: "never in the repo tree; the Vite dev server serves it in dev only"}

  # ---------------- Tooling ----------------
  - {id: export, label: "tools/export_app_data.py", lane: tooling, type: process, note: "reshape, round, validate, write; computes no new number (D1). Ribbon levels come from interim iv_index_daily"}
  - {id: export_check, label: "export_app_data.py --mode synthetic --check", lane: tooling, type: process, note: "regenerate in a temp dir and compare with the committed fixture"}
  - {id: build_nb, label: "tools/build_notebooks.py", lane: tooling, type: process, note: "--check is the notebook sync test"}
  - {id: notebooks, label: "notebooks/", lane: tooling, type: artifact, note: "generated from src/ivf; never hand-edited"}

  # ---------------- App ----------------
  - {id: loader, label: "app/src/lib loaders", lane: app, type: process, note: "check envelope and invariants, show the data_mode badge; compute nothing"}
  - {id: page_ribbon, label: "Term-structure ribbon (3D)", lane: app, type: ui, note: "term_structure.json, series"}
  - {id: page_race, label: "Model race", lane: app, type: ui, note: "model_race.json, series"}
  - {id: page_surface, label: "Error surface (3D)", lane: app, type: ui, note: "error_surface.json, aggregate"}
  - {id: page_equity, label: "Equity curve", lane: app, type: ui, note: "equity_curves.json, series"}
  - {id: dist_guard, label: "npm run verify", lane: app, type: process, note: "fails if any file in dist/ has data_mode real"}

edges:
  # sources to the fetcher
  - {from: cboe, to: fetch, label: "HTTP GET, follow 307"}
  - {from: fred, to: fetch, label: "fallback series"}
  - {from: yfinance, to: fetch, label: "DataFrame to CSV, hashed"}
  - {from: configs, to: fetch, label: "URLs, tickers"}
  # raw layer
  - {from: fetch, to: raw, label: "{sha256}.csv if absent"}
  - {from: fetch, to: prov, label: "append one line"}
  - {from: raw, to: verify, label: "re-hash"}
  - {from: synthetic, to: synth_raw, label: "seeded CSVs"}
  # interim and processed
  - {from: raw, to: build_interim, label: "latest snapshot"}
  - {from: synth_raw, to: build_interim, label: "same loaders"}
  - {from: build_interim, to: interim, label: "typed parquet"}
  - {from: interim, to: features, label: "iv_index_daily, price_daily"}
  - {from: features, to: processed, label: "calendar, feature, target_value, regime_label, run"}
  # walk-forward
  - {from: configs, to: splits, label: "protocol: dev_start, holdout_start, fold_len"}
  - {from: processed, to: splits, label: "calendar t_idx"}
  - {from: splits, to: models, label: "folds: cutoff, origins"}
  - {from: processed, to: models, label: "features at t (L1)"}
  - {from: models, to: forecasts, label: "fit rows, forecast rows"}
  # evaluation and backtest
  - {from: forecasts, to: evaluation, label: "same origins for every model"}
  - {from: processed, to: evaluation, label: "targets y, v; regimes"}
  - {from: evaluation, to: results, label: "metric, dm_test, mz_regression"}
  - {from: forecasts, to: backtest, label: "signal at origin t"}
  - {from: interim, to: backtest, label: "VXX, SVXY adj_close"}
  - {from: sharpe, to: backtest, label: "PSR, DSR"}
  - {from: backtest, to: results, label: "backtest_daily, strategy_summary"}
  # committed reports
  - {from: results, to: ivf_reports, label: "aggregates"}
  - {from: ivf_reports, to: reports_dir, label: "set P only, one release"}
  # export to the app JSON contract
  - {from: results, to: export, label: "metrics, DM, MZ, equity"}
  - {from: forecasts, to: export, label: "yhat for the race"}
  - {from: processed, to: export, label: "target_value, regime_label, run"}
  - {from: schemas, to: export, label: "validate before writing"}
  - {from: export, to: synth_json, label: "synthetic: committed"}
  - {from: export, to: real_json, label: "real: outside the repo"}
  - {from: export, to: export_check, label: "temp-dir rerun"}
  - {from: synth_json, to: export_check, label: "compare with fixture"}
  # notebooks
  - {from: models, to: build_nb, label: "generated from src/ivf (all modules)"}
  - {from: build_nb, to: notebooks, label: "generate"}
  # app
  - {from: synth_json, to: loader, label: "manifest.json first"}
  - {from: real_json, to: loader, label: "dev server only"}
  - {from: schemas, to: loader, label: "contract tests"}
  - {from: loader, to: page_ribbon}
  - {from: loader, to: page_race}
  - {from: loader, to: page_surface}
  - {from: loader, to: page_equity}
  - {from: synth_json, to: dist_guard, label: "vite build copies to dist/"}
