server {
    listen 8080;
    server_name _;
    # Do not put the nginx version in the Server header or on error pages.
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. `always` adds them to error responses (404, 5xx) as well.
    # The CSP fits a static Vite + three.js bundle: scripts and the stylesheet come from this origin;
    # style-src needs 'unsafe-inline' because React sets style="" attributes and one <style> element;
    # img-src allows data: and blob: for textures three.js builds in memory; no workers, no eval,
    # no third-party requests (checked on the built bundle). frame-ancestors forbids embedding.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
